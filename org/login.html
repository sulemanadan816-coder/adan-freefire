<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Organizer Login — Adan Free Fire Platform</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body class="admin-body">

<div class="login-wrap">
  <div class="login-card">
    <h1>Organizer Login</h1>
    <p class="sub">Manage your organization's tournaments.</p>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm">
      <div class="login-field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Log In</button>
    </form>

    <a href="signup.html" class="login-back">Don't have an organization yet? Sign up</a>
    <a href="../index.html" class="login-back">← Back to public site</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script src="org-auth.js"></script>
<script>
  (async function () {
    const { data: { session } } = await window.db.auth.getSession();
    if (session) {
      const { data: membership } = await window.db
        .from("organization_members")
        .select("organization_id")
        .eq("user_id", session.user.id)
        .limit(1)
        .maybeSingle();
      if (membership) window.location.href = "dashboard.html";
    }
  })();

  const params = new URLSearchParams(window.location.search);
  const errEl = document.getElementById("loginError");
  if (params.get("error") === "no_org") {
    errEl.textContent = "That account isn't linked to any organization yet.";
    errEl.classList.add("show");
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    btn.disabled = true;
    btn.textContent = "Logging in...";
    errEl.classList.remove("show");

    const result = await orgLogin(email, password);

    btn.disabled = false;
    btn.textContent = "Log In";

    if (!result.ok) {
      errEl.textContent = result.message;
      errEl.classList.add("show");
      return;
    }

    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
