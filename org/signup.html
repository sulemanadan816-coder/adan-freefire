<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Your Organizer Account — Adan Free Fire Platform</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body class="admin-body">

<div class="login-wrap">
  <div class="login-card">
    <h1>Start Your Organization</h1>
    <p class="sub">Create a free trial account to run your own tournaments.</p>

    <div class="login-error" id="signupError"></div>
    <div class="login-error" id="signupNotice" style="background: rgba(14,165,233,0.12); border-color: var(--cyan); color: var(--text-1); display: none;"></div>

    <form id="signupForm">
      <div class="login-field">
        <label for="orgName">Organization Name</label>
        <input type="text" id="orgName" required minlength="2" placeholder="e.g. Karachi Gaming League" />
      </div>
      <div class="login-field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary" id="signupBtn">Create Account</button>
    </form>

    <a href="login.html" class="login-back">Already have an account? Log in</a>
    <a href="../index.html" class="login-back">← Back to public site</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script src="org-auth.js"></script>
<script>
  (async function () {
    const { data: { session } } = await window.db.auth.getSession();
    if (session) {
      const { data: membership } = await window.db
        .from("organization_members")
        .select("organization_id")
        .eq("user_id", session.user.id)
        .limit(1)
        .maybeSingle();
      if (membership) window.location.href = "dashboard.html";
    }
  })();

  document.getElementById("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("signupBtn");
    const errEl = document.getElementById("signupError");
    const noticeEl = document.getElementById("signupNotice");
    errEl.classList.remove("show");
    noticeEl.style.display = "none";

    const orgName = document.getElementById("orgName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    btn.disabled = true;
    btn.textContent = "Creating account...";

    const result = await orgSignup(orgName, email, password);

    btn.disabled = false;
    btn.textContent = "Create Account";

    if (!result.ok) {
      errEl.textContent = result.message;
      errEl.classList.add("show");
      return;
    }

    if (result.needsEmailConfirm) {
      noticeEl.textContent = result.message;
      noticeEl.style.display = "block";
      document.getElementById("signupForm").reset();
      return;
    }

    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
