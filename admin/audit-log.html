<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audit Log — Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="admin.css" />
<style>
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center; }
  .toolbar input, .toolbar select {
    padding:10px 12px; border-radius: var(--radius-sm); background: var(--bg-panel-2);
    border:1px solid var(--border); color: var(--text-1); font-size:13.5px; font-family:var(--f-body);
  }
  .log-table { width:100%; border-collapse:collapse; font-size:13.5px; }
  .log-table th { text-align:left; padding:10px 8px; color:var(--text-3); font-family:var(--f-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; border-bottom:1px solid var(--border-strong); }
  .log-table td { padding:10px 8px; border-bottom:1px solid var(--border); vertical-align: top; }
  .log-table tr.live-row { animation: rowFlash 1.6s ease; }
  @keyframes rowFlash { from { background: var(--ember-soft); } to { background: transparent; } }
  .action-pill { display:inline-block; padding:3px 9px; border-radius:100px; font-size:11px; font-weight:700; background: var(--bg-panel-2); color: var(--text-2); font-family:var(--f-mono); }
  .who { font-size:12px; color: var(--text-3); }
  .details-btn { font-size:11.5px; padding:5px 10px; border-radius:6px; font-weight:700; background: var(--bg-panel-2); border:1px solid var(--border); color: var(--text-2); }
  .details-btn:hover { border-color: var(--border-strong); color: var(--text-1); }
  .pager { display:flex; gap:8px; align-items:center; margin-top:16px; justify-content:flex-end; }
  .pager button { padding:6px 12px; border-radius:6px; background:var(--bg-panel-2); border:1px solid var(--border); font-size:12.5px; }
  .pager button:disabled { opacity:0.35; }
  .view-overlay {
    position:fixed; inset:0; background:rgba(4,5,6,0.75); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; z-index:600; padding:20px;
  }
  .view-overlay.open { display:flex; }
  .view-box {
    background:var(--bg-panel); border:1px solid var(--border-strong); border-radius:var(--radius);
    padding:26px; max-width:520px; width:100%; max-height:80vh; overflow-y:auto;
  }
  .view-box pre { white-space: pre-wrap; word-break: break-word; font-family: var(--f-mono); font-size:12px; color: var(--text-2); background: var(--bg-panel-2); padding:14px; border-radius: var(--radius-sm); border:1px solid var(--border); margin-top:10px; }
  .live-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background: var(--success); margin-right:6px; box-shadow: 0 0 0 0 rgba(53,214,138,0.6); animation: pulseDot 1.8s infinite; }
  @keyframes pulseDot { 0% { box-shadow: 0 0 0 0 rgba(53,214,138,0.5); } 70% { box-shadow: 0 0 0 8px rgba(53,214,138,0); } 100% { box-shadow: 0 0 0 0 rgba(53,214,138,0); } }
</style>
</head>
<body class="admin-body">

<aside class="admin-sidebar">
  <div class="admin-brand">
    <strong>ADAN <span style="color:var(--ember)">FF</span></strong>
    <span>Tournament Admin</span>
  </div>
  <nav class="admin-nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="#" class="disabled">Tournaments <span class="nav-tag">soon</span></a>
    <a href="registrations.html">Registrations</a>
    <a href="flags.html">Duplicate Checks</a>
    <a href="teams.html">Teams</a>
    <a href="players.html">Players</a>
    <a href="matches.html">Matches</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="#" class="disabled">Room Control <span class="nav-tag">soon</span></a>
    <a href="#" class="disabled">Announcements <span class="nav-tag">soon</span></a>
    <a href="#" class="disabled">Rules <span class="nav-tag">soon</span></a>
    <a href="tournament-settings.html">Tournament Settings</a>
    <a href="live-control.html">Live Control</a>
    <a href="ai.html">AI Manager</a>
    <a href="audit-log.html" class="active">Audit Log</a>
  </nav>
  <div class="admin-footer-nav">
    <button id="logoutBtn">Logout</button>
  </div>
</aside>

<main class="admin-main">
  <div class="admin-topbar">
    <h1><span class="live-dot" id="liveDot" style="display:none;"></span>Audit Log</h1>
    <span class="admin-user" id="adminUserLabel">…</span>
  </div>

  <div class="admin-content">
    <div class="admin-panel">
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search action, record ID, admin email…" style="min-width:260px;" />
        <select id="actionFilter">
          <option value="">All actions</option>
        </select>
        <select id="dateFilter">
          <option value="">All time</option>
          <option value="today">Today</option>
          <option value="7">Last 7 days</option>
          <option value="30">Last 30 days</option>
        </select>
        <select id="sortOrder">
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first</option>
        </select>
      </div>

      <div id="tableWrap" class="admin-loading">Loading…</div>
      <div class="pager" id="pager" style="display:none;">
        <button id="prevBtn">← Prev</button>
        <span id="pageLabel" style="font-family:var(--f-mono); font-size:12px; color:var(--text-3);"></span>
        <button id="nextBtn">Next →</button>
      </div>
    </div>
  </div>
</main>

<!-- Details dialog -->
<div class="view-overlay" id="viewOverlay">
  <div class="view-box" id="viewBox"></div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="admin-auth.js"></script>
<script src="audit-log.js"></script>
</body>
</html>
