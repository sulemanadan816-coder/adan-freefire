<!DOCTYPE html>

<head>

<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="admin.css" />
<style>
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 1080px) { .settings-grid { grid-template-columns: 1fr; } }
  .login-field { margin-bottom: 14px; }
  .login-field input, .login-field select {
    width:100%; padding:12px 14px; border-radius:8px; background:var(--bg-panel-2);
    border:1px solid var(--border); color:var(--text-1); font-size: 14px;
  }
  .toggle-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); }
  .toggle-row:last-child { border-bottom:none; }
  .toggle-row span.label { font-weight:600; font-size:14px; }
  .toggle-row span.hint { display:block; color:var(--text-3); font-size:11.5px; margin-top:2px; font-weight:400; }
  .switch { position:relative; display:inline-block; width:44px; height:24px; flex-shrink:0; }
  .switch input { opacity:0; width:0; height:0; }
  .switch .slider { position:absolute; inset:0; background:var(--bg-panel-3); border:1px solid var(--border); border-radius:100px; cursor:pointer; transition:0.2s; }
  .switch .slider::before { content:""; position:absolute; width:18px; height:18px; left:2px; top:2px; background:var(--text-3); border-radius:50%; transition:0.2s; }
  .switch input:checked + .slider { background: var(--ember-soft); border-color: var(--ember); }
  .switch input:checked + .slider::before { transform: translateX(20px); background: var(--ember); }
  .games-toggle-grid { display:grid; grid-template-columns: 1fr 1fr; gap:0 20px; }
  @media (max-width: 600px) { .games-toggle-grid { grid-template-columns: 1fr; } }
  .save-row { display:flex; justify-content:flex-end; margin-top:16px; }
  .setup-note { background: rgba(255,77,28,0.08); border-left:2px solid var(--ember); border-radius:4px; padding:12px 14px; font-size:12.5px; color:var(--text-3); margin-bottom:20px; }
  .setup-note code { background:var(--bg-panel-3); padding:1px 5px; border-radius:4px; }
</style>
</head>
