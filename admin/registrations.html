<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registrations — Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="admin.css" />
<style>
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; align-items:center; }
  .toolbar input, .toolbar select {
    padding:10px 12px; border-radius: var(--radius-sm); background: var(--bg-panel-2);
    border:1px solid var(--border); color: var(--text-1); font-size:13.5px; font-family:var(--f-body);
  }
  .reg-table { width:100%; border-collapse:collapse; font-size:13.5px; }
  .reg-table th { text-align:left; padding:10px 8px; color:var(--text-3); font-family:var(--f-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; border-bottom:1px solid var(--border-strong); }
  .reg-table td { padding:10px 8px; border-bottom:1px solid var(--border); vertical-align: top; }
  .badge { display:inline-block; padding:3px 9px; border-radius:100px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; }
  .badge-pending { background: rgba(255,201,60,0.15); color: var(--gold); }
  .badge-approved { background: rgba(53,214,138,0.15); color: var(--success); }
  .badge-rejected { background: rgba(255,92,92,0.15); color: var(--danger); }
  .badge-waiting { background: rgba(0,229,199,0.15); color: var(--cyan); }
  .badge-disqualified { background: rgba(245,243,239,0.1); color: var(--text-3); }
  .badge-verified { background: rgba(0,166,81,0.16); color: #35d68a; }
  .badge-unpaid { background: rgba(245,243,239,0.1); color: var(--text-3); }
  .badge-pending_verification { background: rgba(255,201,60,0.15); color: var(--gold); }
  .row-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .row-actions button {
    font-size:11.5px; padding:6px 10px; border-radius:6px; font-weight:700;
    background: var(--bg-panel-2); border:1px solid var(--border); color: var(--text-2);
  }
  .row-actions button:hover { border-color: var(--border-strong); color: var(--text-1); }
  .row-actions button.approve:hover { color: var(--success); border-color: var(--success); }
  .row-actions button.reject:hover { color: var(--danger); border-color: var(--danger); }
  .row-actions button.delete:hover { color: var(--danger); border-color: var(--danger); }
  .pager { display:flex; gap:8px; align-items:center; margin-top:16px; justify-content:flex-end; }
  .pager button { padding:6px 12px; border-radius:6px; background:var(--bg-panel-2); border:1px solid var(--border); font-size:12.5px; }
  .pager button:disabled { opacity:0.35; }
  .confirm-overlay, .view-overlay {
    position:fixed; inset:0; background:rgba(4,5,6,0.75); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; z-index:600; padding:20px;
  }
  .confirm-overlay.open, .view-overlay.open { display:flex; }
  .confirm-box, .view-box {
    background:var(--bg-panel); border:1px solid var(--border-strong); border-radius:var(--radius);
    padding:26px; max-width:420px; width:100%;
  }
  .view-box { max-width: 480px; max-height: 80vh; overflow-y:auto; }
  .confirm-box .actions { display:flex; gap:10px; margin-top:20px; }
  .view-row { display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid var(--border); font-size:13.5px; }
  .view-row .k { color:var(--text-3); font-family:var(--f-mono); font-size:11px; text-transform:uppercase; }
</style>
</head>
<body class="admin-body">

<aside class="admin-sidebar">
  <div class="admin-brand">
    <strong>ADAN <span style="color:var(--ember)">FF</span></strong>
    <span>Tournament Admin</span>
  </div>
  <nav class="admin-nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="#" class="disabled">Tournaments <span class="nav-tag">soon</span></a>
    <a href="registrations.html" class="active">Registrations</a>
    <a href="flags.html">Duplicate Checks</a>
    <a href="teams.html">Teams</a>
    <a href="players.html">Players</a>
    <a href="matches.html">Matches</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="#" class="disabled">Room Control <span class="nav-tag">soon</span></a>
    <a href="#" class="disabled">Announcements <span class="nav-tag">soon</span></a>
    <a href="#" class="disabled">Rules <span class="nav-tag">soon</span></a>
    <a href="tournament-settings.html">Tournament Settings</a>
    <a href="live-control.html">Live Control</a>
    <a href="ai.html">AI Manager</a>
    <a href="audit-log.html">Audit Log</a>
  </nav>
  <div class="admin-footer-nav">
    <button id="logoutBtn">Logout</button>
  </div>
</aside>

<main class="admin-main">
  <div class="admin-topbar">
    <h1>Registrations</h1>
    <span class="admin-user" id="adminUserLabel">…</span>
  </div>

  <div class="admin-content">
    <div class="admin-panel">
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search team, captain, email, UID…" style="min-width:240px;" />
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
          <option value="waiting">Waiting</option>
          <option value="disqualified">Disqualified</option>
        </select>
        <select id="sortOrder">
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first</option>
        </select>
      </div>

      <div id="tableWrap" class="admin-loading">Loading…</div>
      <div class="pager" id="pager" style="display:none;">
        <button id="prevBtn">← Prev</button>
        <span id="pageLabel" style="font-family:var(--f-mono); font-size:12px; color:var(--text-3);"></span>
        <button id="nextBtn">Next →</button>
      </div>
    </div>
  </div>
</main>

<!-- Confirm dialog -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3 id="confirmTitle" style="font-size:20px; margin-bottom:8px;">Are you sure?</h3>
    <p id="confirmMsg" style="color:var(--text-2); font-size:13.5px;"></p>
    <div class="actions">
      <button class="btn btn-secondary" id="confirmCancel" style="flex:1;">Cancel</button>
      <button class="btn btn-primary" id="confirmOk" style="flex:1;">Confirm</button>
    </div>
  </div>
</div>

<!-- View dialog -->
<div class="view-overlay" id="viewOverlay">
  <div class="view-box" id="viewBox"></div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script src="admin-auth.js"></script>
<script src="registrations.js"></script>
</body>
</html>
