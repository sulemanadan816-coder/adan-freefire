<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tournament Settings — Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="admin.css" />
<style>
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 1080px) { .settings-grid { grid-template-columns: 1fr; } }
  .settings-grid.full { grid-template-columns: 1fr; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .field-row.three { grid-template-columns: 1fr 1fr 1fr; }
  .field-row .login-field { margin-bottom: 0; }
  textarea.settings-textarea {
    width:100%; min-height:80px; padding:12px 14px; border-radius: var(--radius-sm);
    background: var(--bg-panel-2); border:1px solid var(--border); color: var(--text-1);
    font-family: var(--f-body); font-size:14px;
  }
  .day-picker { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .day-chip {
    padding:8px 14px; border-radius:100px; background:var(--bg-panel-2); border:1px solid var(--border);
    font-size:12.5px; font-weight:700; cursor:pointer; user-select:none;
  }
  .day-chip.active { background: var(--ember-soft); border-color: var(--ember); color: var(--ember); }
  .dist-row { display:grid; grid-template-columns: 1fr 140px 40px; gap:8px; margin-bottom:8px; align-items:center; }
  .dist-row input { padding:9px 12px; border-radius:7px; background:var(--bg-panel-2); border:1px solid var(--border); color:var(--text-1); font-size:13px; }
  .dist-remove { background:none; color:var(--danger); font-size:18px; }
  .dist-summary { display:flex; gap:18px; font-family:var(--f-mono); font-size:12.5px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
  .dist-summary .warn { color: var(--danger); }
  .special-row { display:grid; grid-template-columns: 1.4fr 1fr 0.7fr 0.7fr 36px; gap:8px; margin-bottom:8px; align-items:center; }
  .special-row input { padding:9px 12px; border-radius:7px; background:var(--bg-panel-2); border:1px solid var(--border); color:var(--text-1); font-size:12.5px; }
  .toggle-row { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .save-row { display:flex; justify-content:flex-end; margin-top:16px; }
</style>
</head>
<body class="admin-body">

<aside class="admin-sidebar">
  <div class="admin-brand">
    <strong>ADAN <span style="color:var(--ember)">FF</span></strong>
    <span>Tournament Admin</span>
  </div>
  <nav class="admin-nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="#" class="disabled">Tournaments <span class="nav-tag">soon</span></a>
    <a href="registrations.html">Registrations</a>
    <a href="flags.html">Duplicate Checks</a>
    <a href="teams.html">Teams</a>
    <a href="players.html">Players</a>
    <a href="matches.html">Matches</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="#" class="disabled">Room Control <span class="nav-tag">soon</span></a>
    <a href="#" class="disabled">Announcements <span class="nav-tag">soon</span></a>
    <a href="#" class="disabled">Rules <span class="nav-tag">soon</span></a>
    <a href="tournament-settings.html" class="active">Tournament Settings</a>
    <a href="live-control.html">Live Control</a>
    <a href="ai.html">AI Manager</a>
    <a href="audit-log.html">Audit Log</a>
  </nav>
  <div class="admin-footer-nav">
    <button id="logoutBtn">Logout</button>
  </div>
</aside>

<main class="admin-main">
  <div class="admin-topbar">
    <h1>Tournament Settings</h1>
    <span class="admin-user" id="adminUserLabel">…</span>
  </div>

  <div class="admin-content" id="settingsContent">
    <div class="admin-loading" style="padding:20px;">Loading tournament…</div>
  </div>
</main>

<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="admin-auth.js"></script>
<script src="tournament-settings.js"></script>
</body>
</html>
