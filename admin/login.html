<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — Pakistan Elite Free Fire Tournament</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

<div class="login-wrap">
  <div class="login-card">
    <h1>Admin Login</h1>
    <p class="sub">Owner-only access to the Tournament Dashboard.</p>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm">
      <div class="login-field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Log In</button>
    </form>

    <a href="../index.html" class="login-back">← Back to public site</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script src="admin-auth.js"></script>
<script>
  (async function () {
    // If already logged in as admin, skip straight to dashboard
    const { data: { session } } = await window.db.auth.getSession();
    if (session) window.location.href = "dashboard.html";
  })();

  const params = new URLSearchParams(window.location.search);
  const errEl = document.getElementById("loginError");
  if (params.get("error") === "unauthorized") {
    errEl.textContent = "That account does not have admin access.";
    errEl.classList.add("show");
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    btn.disabled = true;
    btn.textContent = "Logging in...";
    errEl.classList.remove("show");

    const result = await adminLogin(email, password);

    btn.disabled = false;
    btn.textContent = "Log In";

    if (!result.ok) {
      errEl.textContent = result.message;
      errEl.classList.add("show");
      return;
    }

    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
